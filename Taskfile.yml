version: '3'

vars:
  REGISTRY: ghcr.io/pyck-ai/baseimages
  BAKE_ARGS:
    sh: |
      cat buildargs.conf | grep -v '^#' | grep -v '^$' | sed 's/^/--set *.args./' | tr '\n' ' '

dotenv:
  - buildargs.conf

tasks:
  #######################################################################
  #   BUILD TASKS (Docker Bake wrappers)                                #
  #######################################################################

  build:
    desc: "Build base images using Docker Bake (local). Args: TARGETS=alpine,debian ARCH=arm64"
    vars:
      ARCH:
        sh: uname -m
      TARGET_ARGS: '{{if .TARGETS}}{{range splitList "," .TARGETS}}"{{.}}" {{end}}{{end}}'
    cmds:
      - docker buildx bake {{.BAKE_ARGS}} --set *.platform=linux/{{.ARCH}} --load {{.TARGET_ARGS}}

  #######################################################################
  #   TEST TASKS                                                        #
  #######################################################################

  test:flutter:generate-binary:
    desc: Generate binary test file from text example
    deps:
      - task: build
        vars:
          TARGETS: flutter
    cmds:
      - |
        docker run --rm \
          -v {{.PWD}}/flutter:/app:z \
          -w /opt/rfw-validator \
          {{.REGISTRY}}/flutter:latest \
          dart run generate_binary.dart /app/example.dart /app/example.rfw

  test:flutter:
    desc: Test Flutter image RFW validator with text and binary formats
    deps:
      - task: build
        vars:
          TARGETS: flutter
      - test:flutter:generate-binary
    cmds:
      - |
        echo "Testing text format (.rfwtxt)..."
        docker run --rm \
          -v {{.PWD}}/flutter:/app:z \
          {{.REGISTRY}}/flutter:latest \
          validate-rfw example.dart
      - |
        echo "Testing binary format (.rfw)..."
        docker run --rm \
          -v {{.PWD}}/flutter:/app:z \
          {{.REGISTRY}}/flutter:latest \
          validate-rfw example.rfw
