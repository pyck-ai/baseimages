version: '3'

vars:
  REGISTRY: '{{.REGISTRY | default "localhost:5000/pyck-ai/baseimages"}}'
  CI: '{{.CI | default ""}}'

  _BAKE_BUILDARGS:
    sh: >-
      cat buildargs.conf | grep -v '^#' | grep -v '^$' | sed 's/^/--set *.args./' | tr '\n' ' '

  _HOST_ARCH:
    sh: >-
      uname -m

dotenv:
  - buildargs.conf

tasks:
  #######################################################################
  #   BUILD TASKS (Docker Bake wrappers)                                #
  #######################################################################
  
  setup:
    desc: "Create the 'pyck' buildx builder (run once per machine)"
    cmds:
      - |
        docker buildx inspect pyck 2>/dev/null || \
        docker buildx create \
          --name=pyck \
          --driver=docker-container \
          --driver-opt=network=host \
          --buildkitd-flags=--allow-insecure-entitlement=network.host
        docker buildx use pyck

  build:
    desc: "Build base images using Docker Bake. Args: TARGET=alpine,debian ARCH=arm64"
    vars:
    cmds:
      - >-
        docker buildx bake
        --pull
        --push
        --builder pyck
        {{if not .CI}}--set {{ (printf "*.platform=linux/%s" (.ARCH | default ._HOST_ARCH)) | q}}{{end}}
        --set "*.args.REGISTRY"={{ .REGISTRY | q}}
        --var REGISTRY={{ .REGISTRY | q}}
        {{._BAKE_BUILDARGS}}
        {{if .CLI_VERBOSE}}--debug{{end}}
        {{.CLI_ARGS}}

  #######################################################################
  #   TEST TASKS                                                        #
  #######################################################################

  test:flutter:generate-binary:
    desc: Generate binary test file from text example
    deps:
      - task: build
        vars:
          TARGET: flutter
    cmds:
      - |
        docker run --rm \
          -v {{.PWD}}/flutter:/app:z \
          -w /opt/rfw-validator \
          {{.REGISTRY}}/flutter:latest \
          dart run generate_binary.dart /app/example.dart /app/example.rfw

  test:flutter:
    desc: Test Flutter image RFW validator with text and binary formats
    deps:
      - task: build
        vars:
          TARGET: flutter
      - test:flutter:generate-binary
    cmds:
      - |
        echo "Testing text format (.rfwtxt)..."
        docker run --rm \
          -v {{.PWD}}/flutter:/app:z \
          {{.REGISTRY}}/flutter:latest \
          validate-rfw example.dart
      - |
        echo "Testing binary format (.rfw)..."
        docker run --rm \
          -v {{.PWD}}/flutter:/app:z \
          {{.REGISTRY}}/flutter:latest \
          validate-rfw example.rfw
