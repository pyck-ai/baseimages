# Minimal default config for the pyck-ai/baseimages valkey image.
#
# No authentication is configured by default — same as upstream
# valkey/valkey and redis/library images. This is a base image, not a
# hardened deployment: set `requirepass` (or better, `--aclfile`) via a
# mounted config override before exposing this beyond a trusted network.

bind 0.0.0.0 -::1
protected-mode no
port 6379
unixsocket /run/valkey/valkey.sock
unixsocketperm 700

dir /data
daemonize no

# Container logs go to stdout/stderr, not a file.
logfile ""
