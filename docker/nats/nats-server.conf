# Minimal default config for the pyck-ai/baseimages nats image.
#
# No authentication is configured by default — same as the official nats
# image. This is a base image, not a hardened deployment: set an
# `authorization` block (or mount your own config override) before exposing
# this beyond a trusted network.

http: 8222

jetstream {
  store_dir: "/data"
}
