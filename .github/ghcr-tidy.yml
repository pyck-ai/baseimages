# GHCR retention for pyck-ai/baseimages.
#
# Package names are FULL names. This repo nests its images under a
# `baseimages/` prefix, unlike github-runner and flutter-rfw which are top
# level. ghcr-tidy has no prefix-joining helper, so every `match` entry
# below must spell out the full package name.
version: 1
owner: pyck-ai

# Pre-flight proof, taken before any deletion, that the registry is
# readable and a known-good tag resolves — see ghcr-tidy's
# `ManifestCanary` doc for why this must live here rather than as a
# workflow input (the `tidy-ghcr.yml` caller's `inputs` are empty on a
# `schedule` trigger). `baseimages/base:alpine` is chosen deliberately:
# `alpine` has no version token, so it decomposes to an unversioned
# singleton kind and is unconditionally retained — always a keep-root,
# never in DELETE — and `base` is republished by every single build in
# this repo's dependency graph and is the smallest/cheapest image to
# resolve, since nothing in `baseimages` builds without it. A canary
# that could itself be deleted would prove nothing.
canary:
  package: baseimages/base
  tag: alpine

# The numbers that govern an irreversible deletion should be written
# down in the repo they delete from, not inherited silently from a
# default that could change out from under us. keepMajors, keepMinors
# and keepPatches equal ghcr-tidy's own defaults. keepDays is raised
# deliberately from the default 30 to 90 to keep recent builds around
# longer: nothing younger than keepDays is ever deleted, tagged or not,
# which makes it the primary safety control. Raising it can only retain
# more; lowering it is the most dangerous edit available in this file.
retention:
  keepMajors: 1
  keepMinors: 3
  keepPatches: 5
  keepDays: 90

packages:
  - match: baseimages/base
  - match: baseimages/agent
  - match: baseimages/golang
  - match: baseimages/python
  - match: baseimages/typescript
  - match: baseimages/rover
  - match: baseimages/all-in-one
  - match: baseimages/nginx
  - match: baseimages/static
  - match: baseimages/runner

  # Build cache: none of its tags carry a version token (agent-alpine,
  # aws, golang-debian, ...), so every one decomposes to an unversioned
  # singleton kind and is unconditionally retained by the algorithm
  # itself. Needs no configuration here.
  - match: baseimages/buildcache
