name: build
run-name: Build and push Docker images

# Run weekdays at 09:00 UTC
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
  # Validate every PR before merge so Renovate (and humans) always have a status check
  # to gate automerge on. PR runs push by digest only and do not export build cache
  # (see the discover step and push:/cache-to handling below).
  pull_request:

# Cancel any in-progress build for the same ref when a newer one is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/pyck-ai/baseimages

jobs:
  # Read all stage target lists from the bake file so new images
  # are automatically picked up by the parallel build matrices without touching CI.
  discover:
    runs-on: self-hosted
    outputs:
      stage-1-targets: ${{ steps.targets.outputs.stage-1-targets }}
      stage-2-targets: ${{ steps.targets.outputs.stage-2-targets }}
      stage-3-targets: ${{ steps.targets.outputs.stage-3-targets }}
      bakeargs-set: ${{ steps.targets.outputs.bakeargs-set }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read targets and build args from bake file
        id: targets
        run: |
          set -a && source buildargs.conf && set +a
          bake_print() {
            REGISTRY=${{ env.REGISTRY }} docker buildx bake --print "$1"
          }
          print1=$(bake_print ci-stage-1)
          print2=$(bake_print ci-stage-2)
          print3=$(bake_print ci-stage-3)
          keys() { jq -c '[.target | keys[]]' <<<"$1"; }
          stage1=$(keys "$print1")
          stage2_all=$(keys "$print2")
          stage3_all=$(keys "$print3")
          stage2=$(jq -cn --argjson a "$stage2_all" --argjson prev "$stage1" \
            '[$a[] | select(. as $t | $prev | index($t) | not)]')
          stage3=$(jq -cn --argjson a "$stage3_all" --argjson prev "$stage2_all" \
            '[$a[] | select(. as $t | $prev | index($t) | not)]')
          {
            echo "stage-1-targets=$stage1"
            echo "stage-2-targets=$stage2"
            echo "stage-3-targets=$stage3"
            echo 'bakeargs-set<<EOF'
            grep -v '^#' buildargs.conf | grep -v '^\s*$' | sed 's/^/*.args./'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              # On PRs, disable cache export so an unmerged (possibly broken) bump can't
              # poison the shared registry build cache that scheduled builds rely on.
              echo '*.cache-to='
              # Push PR builds by digest only: clear every target's floating/version tags
              # and push with push-by-digest, so the image is uploaded for inspection
              # (reference it as <repo>@sha256:...) without writing or moving any tag such
              # as golang:alpine-3.24 that scheduled and manual builds own. The repo to
              # push to is derived from each target's first tag (e.g. .../golang:latest).
              jq -rn --argjson p1 "$print1" --argjson p2 "$print2" --argjson p3 "$print3" '
                ($p1.target + $p2.target + $p3.target)
                | to_entries[]
                | .key as $k
                | (.value.tags[0] | sub(":[^/]+$"; "")) as $repo
                | ($k + ".tags="),
                  ($k + ".output=type=image,name=" + $repo + ",push-by-digest=true,name-canonical=true,push=true")'
            fi
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  # Fan out over all ci-stage-1 targets in parallel.
  stage-1:
    needs: [discover]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.discover.outputs.stage-1-targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          targets: ${{ matrix.target }}
          pull: true
          # On schedule/manual runs, push the full floating/version tag set. On PRs the
          # action does not push; instead `set` (from discover) clears tags and pushes
          # by digest only, so PR builds upload for inspection without moving shared tags.
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

  # Fan out over all ci-stage-2 targets in parallel. Each target gets its own
  # runner so images build concurrently rather than sequentially.
  stage-2:
    needs: [discover, stage-1]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.discover.outputs.stage-2-targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          targets: ${{ matrix.target }}
          pull: true
          # On schedule/manual runs, push the full floating/version tag set. On PRs the
          # action does not push; instead `set` (from discover) clears tags and pushes
          # by digest only, so PR builds upload for inspection without moving shared tags.
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

  # Build all-in-one once all stage-2 dependencies are pushed.
  stage-3:
    needs: [discover, stage-2]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.discover.outputs.stage-3-targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          targets: ${{ matrix.target }}
          pull: true
          # On schedule/manual runs, push the full floating/version tag set. On PRs the
          # action does not push; instead `set` (from discover) clears tags and pushes
          # by digest only, so PR builds upload for inspection without moving shared tags.
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

  # Build every image single-arch with --load and run its verify.sh against the
  # assembled image — the post-build gate that enforces the role-based USER
  # contract (and every other assembled-image check) before merge. This is a
  # distinct build from the push stages: verify.sh inspects images loaded into the
  # local daemon, which requires --load and therefore a single platform. `CI=`
  # forces the Taskfile's single-platform --load path — GitHub sets CI=true, which
  # would otherwise select the multi-arch build that --load cannot load.
  verify:
    # Run after the push stages rather than alongside them: this job cold-builds
    # every image single-arch with --load on one runner, so serializing avoids
    # doubling peak build load on the self-hosted pool. verify uses none of
    # discover's outputs, so depending on the stages (which each need discover)
    # is sufficient ordering.
    needs: [stage-1, stage-2, stage-3]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing else in this pipeline needs `task`; the verify flow does, so
      # install it explicitly rather than assuming the runner carries it.
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Named to match the `--builder` the Taskfile passes, and given the same
      # host-network driver options as the push stages. Using the action rather
      # than `task setup` keeps host networking out of the Taskfile, which also
      # has to work under rootless Docker locally.
      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          name: pyck-baseimages
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      # `CI=` (CLI var) forces the Taskfile's single-platform --load path; the
      # step-level CI: "" documents the same intent at the workflow layer, since
      # GitHub sets CI=true which would otherwise select an unloadable multi-arch build.
      - name: Build (--load) and verify every image
        run: task verify CI=
        env:
          CI: ""
          REGISTRY: ${{ env.REGISTRY }}

  # Single aggregate gate for the branch-protection required status check. Matrix
  # jobs can't be required directly: their targets are discovered dynamically, and
  # a matrix job skipped via a failed `needs` reports a bare context that a required
  # check treats as passing. This job has a stable name, runs even when upstream
  # stages fail (if: always()), and fails unless every stage succeeded — so
  # requiring just "gate" gates the whole pipeline without touching CI when images
  # are added or removed.
  gate:
    needs: [discover, stage-1, stage-2, stage-3, verify]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Verify all stages succeeded
        run: |
          results="${{ needs.discover.result }} ${{ needs.stage-1.result }} ${{ needs.stage-2.result }} ${{ needs.stage-3.result }} ${{ needs.verify.result }}"
          for r in $results; do
            [ "$r" = "success" ] || { echo "A stage did not succeed: $results"; exit 1; }
          done
          echo "All stages succeeded."

