name: Build Docker Images

on:
  push:
    branches: [ main, master ]
  schedule:
    # Run every night at 4 AM UTC
    - cron: '0 4 * * *'
permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: pyck-ai/baseimages
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.alpine
            image: alpine
            context: .
          - dockerfile: Dockerfile.debian
            image: debian
            context: .

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to the Container registry
      uses: docker/login-action@v3.5.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: false

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ matrix.image }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=schedule,pattern={{date 'YYYYMMDD'}}
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ matrix.image }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ matrix.image }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ matrix.image }}:${{ github.ref == 'refs/heads/main' && 'latest' || github.sha }}
