name: build
run-name: Build and push Docker images

# Run weekdays at 09:00 UTC
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

# Cancel any in-progress build for the same ref when a newer one is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx builder
        run: task setup

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Read build args
        id: buildargs
        run: |
          {
            echo 'set<<EOF'
            grep -v '^#' buildargs.conf | grep -v '^\s*$' | sed 's/^/*.args./'
            echo '*.args.REGISTRY=ghcr.io/pyck-ai/baseimages'
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          pull: true
          push: true
          set: ${{ steps.buildargs.outputs.set }}
        env:
          REGISTRY: ghcr.io/pyck-ai/baseimages
