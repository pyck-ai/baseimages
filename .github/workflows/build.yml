name: Build Docker Images

on:
  push:
  schedule:
    # Run every night at 4 AM UTC
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  discover:
    runs-on: self-hosted
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: List bake targets
        id: list
        run: |
          set -a && source buildargs.conf && set +a
          targets=$(docker buildx bake --print 2>/dev/null \
            | jq -c '[.target | keys[] | select(startswith("_") | not)]')
          echo "targets=$targets" >> $GITHUB_OUTPUT

  build:
    needs: discover
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          platforms: |-
            linux/amd64
            linux/arm64

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Build and push
        run: |
          set -a && source buildargs.conf && set +a
          BAKE_ARGS=$(grep -v '^#' buildargs.conf | grep -v '^\s*$' | sed 's/^/--set *.args./' | tr '\n' ' ')
          PUSH_FLAG=${{ github.event_name != 'pull_request' && '--push' || '' }}
          docker buildx bake \
            $BAKE_ARGS \
            --set "*.platform=linux/amd64,linux/arm64" \
            --set "${{ matrix.target }}.cache-from=type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.target }}:buildcache" \
            --set "${{ matrix.target }}.cache-to=type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.target }}:buildcache,mode=max" \
            $PUSH_FLAG \
            ${{ matrix.target }}
