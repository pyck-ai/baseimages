name: build
run-name: Build and push Docker images

# Run weekdays at 09:00 UTC
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
  # Validate every PR before merge so Renovate (and humans) always have a status check
  # to gate automerge on. PR runs build but do not push and do not export build cache
  # (see push:/cache-to below).
  pull_request:

# Cancel any in-progress build for the same ref when a newer one is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/pyck-ai/baseimages

jobs:
  # Read all stage target lists from the bake file so new images
  # are automatically picked up by the parallel build matrices without touching CI.
  discover:
    runs-on: self-hosted
    outputs:
      stage-1-targets: ${{ steps.targets.outputs.stage-1-targets }}
      stage-2-targets: ${{ steps.targets.outputs.stage-2-targets }}
      stage-3-targets: ${{ steps.targets.outputs.stage-3-targets }}
      bakeargs-set: ${{ steps.targets.outputs.bakeargs-set }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read targets and build args from bake file
        id: targets
        run: |
          set -a && source buildargs.conf && set +a
          bake_targets() {
            REGISTRY=${{ env.REGISTRY }} docker buildx bake --print "$1" | jq -c '[.target | keys[]]'
          }
          stage1=$(bake_targets ci-stage-1)
          stage2_all=$(bake_targets ci-stage-2)
          stage3_all=$(bake_targets ci-stage-3)
          stage2=$(jq -cn --argjson a "$stage2_all" --argjson prev "$stage1" \
            '[$a[] | select(. as $t | $prev | index($t) | not)]')
          stage3=$(jq -cn --argjson a "$stage3_all" --argjson prev "$stage2_all" \
            '[$a[] | select(. as $t | $prev | index($t) | not)]')
          {
            echo "stage-1-targets=$stage1"
            echo "stage-2-targets=$stage2"
            echo "stage-3-targets=$stage3"
            echo 'bakeargs-set<<EOF'
            grep -v '^#' buildargs.conf | grep -v '^\s*$' | sed 's/^/*.args./'
            # On PRs, disable cache export so an unmerged (possibly broken) bump can't
            # poison the shared registry build cache that scheduled builds rely on.
            if [ "${{ github.event_name }}" = "pull_request" ]; then echo '*.cache-to='; fi
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  # Fan out over all ci-stage-1 targets in parallel.
  stage-1:
    needs: [discover]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.discover.outputs.stage-1-targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7
        with:
          targets: ${{ matrix.target }}
          pull: true
          # Build only on PRs; publish to the registry on schedule/manual runs.
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

  # Fan out over all ci-stage-2 targets in parallel. Each target gets its own
  # runner so images build concurrently rather than sequentially.
  stage-2:
    needs: [discover, stage-1]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.discover.outputs.stage-2-targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7
        with:
          targets: ${{ matrix.target }}
          pull: true
          # Build only on PRs; publish to the registry on schedule/manual runs.
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

  # Build all-in-one once all stage-2 dependencies are pushed.
  stage-3:
    needs: [discover, stage-2]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.discover.outputs.stage-3-targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7
        with:
          targets: ${{ matrix.target }}
          pull: true
          # Build only on PRs; publish to the registry on schedule/manual runs.
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

  # Single aggregate gate for the branch-protection required status check. Matrix
  # jobs can't be required directly: their targets are discovered dynamically, and
  # a matrix job skipped via a failed `needs` reports a bare context that a required
  # check treats as passing. This job has a stable name, runs even when upstream
  # stages fail (if: always()), and fails unless every stage succeeded — so
  # requiring just "gate" gates the whole pipeline without touching CI when images
  # are added or removed.
  gate:
    needs: [discover, stage-1, stage-2, stage-3]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Verify all stages succeeded
        run: |
          results="${{ needs.discover.result }} ${{ needs.stage-1.result }} ${{ needs.stage-2.result }} ${{ needs.stage-3.result }}"
          for r in $results; do
            [ "$r" = "success" ] || { echo "A stage did not succeed: $results"; exit 1; }
          done
          echo "All stages succeeded."

