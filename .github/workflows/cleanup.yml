name: cleanup
run-name: Cleanup

# Run daily at 12:00 UTC. Jobs are chained sequentially to avoid hitting GitHub API rate limits.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

# Never cancel a running cleanup job — partial cleanup is worse than no cleanup.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DRY_RUN: false

  # How long to keep workflow run history.
  WORKFLOWS_RETAIN_DAYS: 30

  # Mark issues stale after RETAIN_DAYS of inactivity, close CLOSE_DAYS after that.
  ISSUES_RETAIN_DAYS: 30
  ISSUES_CLOSE_DAYS: 7

  # Same thresholds for pull requests.
  PRS_RETAIN_DAYS: 30
  PRS_CLOSE_DAYS: 7

  # Delete branches with no activity in this many days (closed PR branches included).
  BRANCHES_RETAIN_DAYS: 90

  # Keep at least RETAIN_VERSIONS tagged image versions; delete anything else older than RETAIN_DAYS.
  IMAGES_RETAIN_DAYS: 90
  IMAGES_RETAIN_VERSIONS: 10

jobs:
  # Parse docker-bake.hcl to produce the list of GHCR image names dynamically,
  # so adding a new image doesn't require updating this workflow.
  # Names come from the repository part of each target's tags (e.g. golang),
  # not the bake target keys (e.g. golang-alpine) — the latter aren't packages.
  discover:
    name: Discover container images
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - id: list
        run: |
          set -a && source buildargs.conf && set +a
          images=$(docker buildx bake --print 2>/dev/null \
            | jq -c '[.target[].tags[]? | split(":")[0] | split("/") | last] | unique')
          echo "images=$images" >> $GITHUB_OUTPUT

  # Delete workflow runs older than WORKFLOWS_RETAIN_DAYS, keeping at least 1 per workflow.
  clean-old-workflow-runs:
    name: Delete old workflow runs
    needs: discover
    runs-on: self-hosted
    permissions:
      actions: write
    steps:
      - uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: ${{ env.WORKFLOWS_RETAIN_DAYS }}
          keep_minimum_runs: 1
          dry_run: ${{ env.DRY_RUN }}
          check_branch_existence: false
          check_pullrequest_exist: false

  # Mark issues and PRs stale after RETAIN_DAYS of inactivity and close them CLOSE_DAYS later.
  # Draft PRs are exempt. Runs after workflow cleanup to space out API calls.
  clean-stale-issues-and-prs:
    name: Close stale open PRs
    needs: clean-old-workflow-runs
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          days-before-issue-stale: ${{ env.ISSUES_RETAIN_DAYS }}
          days-before-issue-close: ${{ env.ISSUES_CLOSE_DAYS }}
          close-issue-message: 'Closing due to inactivity for more than ${{ env.ISSUES_RETAIN_DAYS }} days.'
          stale-issue-label: 'stale'
          days-before-pr-stale: ${{ env.PRS_RETAIN_DAYS }}
          days-before-pr-close: ${{ env.PRS_CLOSE_DAYS }}
          close-pr-message: 'Closing due to inactivity for more than ${{ env.PRS_RETAIN_DAYS }} days.'
          stale-pr-label: 'stale'
          exempt-draft-pr: true
          delete-branch: false
          operations-per-run: 100
          debug-only: ${{ env.DRY_RUN }}

  # Delete branches with no commits in the last BRANCHES_RETAIN_DAYS days.
  # Runs after stale PR closure so recently-closed PR branches are eligible immediately.
  clean-stale-branches:
    name: Delete stale branches
    needs: clean-stale-issues-and-prs
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-tags: true
      - uses: beatlabs/delete-old-branches-action@4eeeb8740ff8b3cb310296ddd6b43c3387734588 # v0.0.11
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          date: '${{ env.BRANCHES_RETAIN_DAYS }} days ago'
          dry_run: '${{ env.DRY_RUN }}'
          delete_tags: false
          exclude_open_pr_branches: true

  # Prune old GHCR images for each target. Runs after branch cleanup to spread API load.
  # max-parallel: 2 prevents all images from hammering the Packages API simultaneously.
  clean-ghcr:
    name: Delete old container images (${{ matrix.image }})
    needs: [discover, clean-stale-branches]
    runs-on: self-hosted
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      # Remove all untagged (dangling) image versions first.
      - name: Delete untagged versions
        uses: vlaurin/action-ghcr-prune@0cf7d39f88546edd31965acba78cdcb0be14d641 # v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          organization: ${{ github.repository_owner }}
          container: baseimages/${{ matrix.image }}
          dry-run: ${{ env.DRY_RUN }}
          prune-untagged: true

      # Delete tagged versions beyond IMAGES_RETAIN_VERSIONS, except 'latest' and semver tags
      # that are younger than IMAGES_RETAIN_DAYS. prune-tags-regexes selects all tags as
      # candidates; keep-* inputs then protect the ones we want to keep.
      - name: Delete old tagged versions
        uses: vlaurin/action-ghcr-prune@0cf7d39f88546edd31965acba78cdcb0be14d641 # v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          organization: ${{ github.repository_owner }}
          container: baseimages/${{ matrix.image }}
          dry-run: ${{ env.DRY_RUN }}
          prune-tags-regexes: ^.+$
          keep-last: ${{ env.IMAGES_RETAIN_VERSIONS }}
          keep-tags-regexes: |
              ^latest$
              ^v\d+.+?$
          keep-younger-than: ${{ env.IMAGES_RETAIN_DAYS }}
