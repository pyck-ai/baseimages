name: tidy-ghcr
run-name: Tidy GHCR

# Runs `.github/scripts/prune-ghcr.sh`, which prunes GHCR package versions in
# this repo's `pyck-ai/baseimages` packages using reachability from kept
# tagged roots (index -> child manifest, attestation manifests owned by
# their subject) rather than a flat "untagged == garbage" rule.
#
# WHY THE OLD APPROACH IS GONE: this workflow used to run
# vlaurin/action-ghcr-prune with `prune-untagged: true`. GHCR lists the
# child platform manifests AND buildx provenance attestation manifests of a
# live multi-arch index as separate UNTAGGED package versions, so that
# action deleted pieces of currently tagged images. This already broke 168
# published tags across the golang, rover, all-in-one, and nginx packages
# (see audit-ghcr.sh). prune-ghcr.sh replaces that action entirely, including
# its own package discovery: it enumerates the REAL packages from the GitHub
# Packages API and classifies them against the bakefile, instead of deriving
# the image list from `docker buildx bake --print` the way the old
# `discover` job did — that derivation is exactly why 9 packages (40% of the
# registry: buildcache, flutter, slim, agents, alpine, debian, claude, aws,
# renovate) were permanently invisible to cleanup the moment they were
# renamed or removed from the bakefile. There is no `discover` job here
# anymore; the script does that itself.
#
# `nginx` and `rover` CANNOT be pruned yet: they already have broken tags
# from the incident above (missing child manifests under a currently-tagged
# root), and prune-ghcr.sh correctly refuses to compute a plan for a package
# when a kept root's manifest tree doesn't fully resolve (safety rail #3,
# fail-closed). Those two packages must be reported as fail-closed until
# their existing corruption is remediated separately; that is expected, not
# a bug in this workflow.
#
# There is deliberately NO `schedule:` here. A workflow file is ACTIVE from
# the moment it merges — the old cleanup.yml was only dormant because
# someone had disabled it by hand, and that state does not carry over to a
# new file. The unsafe action is gone and the replacement script defaults to
# dry-run with real safety rails, but this workflow stays dispatch-only
# until a first supervised `apply` run has been reviewed. Once that review
# is done, restore a cron here (offset from tidy-repo.yml's 12:00 UTC run so
# the two don't contend for the shared per-repository GitHub API rate-limit
# budget) and flip the default of the `apply` input.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete (omit for a dry run / plan only)'
        type: boolean
        default: false
      packages:
        description: 'Space-separated package names to restrict to (empty = all)'
        type: string
        default: ''
      budget:
        description: 'Stop after this many deletions in this run'
        type: string
        default: '400'
      keep_all_tagged:
        description: >-
          Keep every tagged root regardless of age or count. Correct mode for
          cache-like packages such as buildcache, whose tags are live entries
          for currently-building targets rather than retention candidates.
        type: boolean
        default: false

# Never cancel a running prune job — partial cleanup is worse than no cleanup.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prune:
    name: Prune GHCR packages
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run prune-ghcr.sh
        id: prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_APPLY: ${{ inputs.apply }}
          IN_PACKAGES: ${{ inputs.packages }}
          IN_BUDGET: ${{ inputs.budget }}
          IN_KEEP_ALL_TAGGED: ${{ inputs.keep_all_tagged }}
        run: |
          set -a && source buildargs.conf && set +a

          args=(--budget "$IN_BUDGET" --json prune-plan.json)

          if [ -n "$IN_PACKAGES" ]; then
            for p in $IN_PACKAGES; do
              args+=(--package "$p")
            done
          fi

          if [ "$IN_KEEP_ALL_TAGGED" = "true" ]; then
            args+=(--keep-all-tagged)
          fi

          if [ "$IN_APPLY" = "true" ]; then
            args+=(--apply)
          fi

          echo "Running: .github/scripts/prune-ghcr.sh ${args[*]}"
          set +e
          .github/scripts/prune-ghcr.sh "${args[@]}"
          rc=$?
          set -e

          case "$rc" in
            0) echo "prune-ghcr.sh: clean run, nothing further to report." ;;
            1) echo "::warning::prune-ghcr.sh exited 1: completed with some delete failures. See the log and prune-plan.json artifact." ;;
            2) echo "::error::prune-ghcr.sh exited 2: operational failure (missing token, network error, or missing tooling). Not a classification problem." ;;
            3) echo "::error::prune-ghcr.sh exited 3: a safety rail tripped, or post-apply verification found a kept tag now broken. Nothing unsafe was deleted." ;;
            *) echo "::error::prune-ghcr.sh exited unexpected code $rc." ;;
          esac

          echo "NOTE: exit 2 with nginx and/or rover reported under FAIL-CLOSED is currently EXPECTED — those two packages already have broken tags from the pre-existing registry corruption (see audit-ghcr.sh) and prune-ghcr.sh correctly refuses to plan for them until that is remediated separately. This is not a new problem introduced by this run."

          exit "$rc"

      - name: Upload prune plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prune-plan
          path: prune-plan.json
          retention-days: 7
