name: ci
run-name: Check the source

# The source checks that need no image build (Dockerfile checks over every bake
# target, shellcheck, markdownlint), run through `task ci` so a laptop and CI
# run the same thing. The image build itself is build.yml. See
# pyck-ai/guidelines docs/ci.md.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/**']

# Cancel superseded runs, but only for PRs: a push to main should always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    # `docker`: `bake --check` and the shellcheck container need the docker
    # CLI, which talks to the rootless podman socket at $DOCKER_HOST.
    runs-on: [pyck-ai, firecracker, light, docker, buildkit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      # runner-init starts podman in the background; wait for its socket.
      - name: Wait for podman
        run: runner-init --wait podman 120
      # `bake --check` needs a buildx builder. buildx's default
      # docker-container builder cannot start on rootless podman (its init
      # needs a private PID namespace), so point buildx at the runner's own
      # rootless BuildKit through the remote driver. BUILDX_BUILDER makes
      # every buildx call in `task ci` use it; a laptop keeps its default.
      - name: Set up buildx (the runner's rootless BuildKit)
        run: |
          runner-init --wait buildkit 180
          docker buildx create --name ci --driver remote \
            "${BUILDKIT_HOST:?runner-init is present but BUILDKIT_HOST is not set}"
          docker buildx inspect ci --bootstrap
      - run: task ci
        env:
          BUILDX_BUILDER: ci

  # The check the org ruleset requires. It lives in this file, not in a
  # reusable workflow, so its name stays `ci-success`.
  ci-success:
    needs: [ci]
    if: always()
    permissions: {}
    runs-on: [pyck-ai, firecracker, light]
    steps:
      - uses: pyck-ai/github-actions/gate@04c6f5cd724c6c65a2c2a613f4a97111bbf6347f # main 2026-10-15
        with:
          needs: ${{ toJSON(needs) }}
