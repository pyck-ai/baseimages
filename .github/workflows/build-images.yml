name: build-images
run-name: Build and push Docker images

# Publish on every push to main so merged changes go out immediately, instead of
# waiting for the next weekday cron slot (previously up to ~72h over a weekend).
#
# The weekday cron is kept alongside the push trigger, not made redundant by it: it
# re-pulls upstream base images with unchanged tags, which is how CVE fixes that carry
# no version-string bump get inherited. A push only rebuilds when something in this
# repo changed, so it can't cover that case.
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
  # Validate every PR before merge so Renovate (and humans) always have a status check
  # to gate automerge on. PR runs push by digest only and do not export build cache
  # (see the discover step and push:/cache-to handling below).
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs, but only for PRs. `github.ref` is `refs/heads/main` for
# both `push` and `schedule`, so those two share a concurrency group; cancelling a
# main run mid-flight is unsafe because `publish` moves tags only after `build`
# has pushed by digest and `verify` has confirmed them — an in-flight cancel
# could leave some tags moved and others not. Main runs therefore queue behind
# each other instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/pyck-ai/baseimages

jobs:
  # Read all stage target lists from the bake file so new images
  # are automatically picked up by the parallel build matrices without touching CI.
  discover:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      bakeargs-set: ${{ steps.targets.outputs.bakeargs-set }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read targets and build args from bake file
        id: targets
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/ci/discover.sh

  # Fan out over the connected components of the dependency graph in parallel.
  # Each component is built in one `bake` invocation, so bake resolves and
  # dedupes the shared subgraph itself instead of build-images.yml re-resolving
  # it across job boundaries (the old stage split rebuilt base-alpine seven
  # times per run — see the comment above `group "default"` in docker-bake.hcl).
  build:
    needs: [discover]
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      # Without fail-fast: false, the default fail-fast: true cancels sibling
      # components mid-build. Because these jobs push as they go, a cancelled
      # sibling can be interrupted after it has already pushed — leaving e.g.
      # base-alpine's component published without base-debian's. Independent
      # components should fail independently.
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: build (${{ matrix.component.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load build args
        run: .github/scripts/ci/load-buildargs.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          targets: ${{ matrix.component.targets }}
          pull: true
          # Always false: `push: true` maps to `--set *.output=type=registry`, which
          # would collide with the per-target `<target>.output=type=image,...` that
          # `discover` now always emits (push-by-digest). Letting that `set` override
          # be the sole writer of `output` avoids depending on unclear
          # pattern-vs-exact-key precedence in buildx.
          push: false
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Export digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          COMPONENT: ${{ matrix.component.name }}
        run: .github/scripts/ci/export-digests.sh

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component.name }}
          path: ${{ runner.temp }}/digests/${{ matrix.component.name }}.json
          retention-days: 1

  # Verify the EXACT digests the stage jobs pushed — a real pre-tag gate rather
  # than a post-publish smoke test. Each stage job pushed by digest only (no
  # tags moved) and uploaded that digest as an artifact; this job downloads all
  # of them, pulls each image by its recorded digest, and runs verify.sh against
  # it. Tags are applied afterwards by `publish`, which only runs once this job
  # succeeds — so a bad image never has a chance to be reachable by a floating
  # tag. This also drops the old cold, cache-less rebuild of all 15 targets on
  # one runner, which duplicated work the matrices had already done.
  verify:
    needs: [build]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Merge digests
        run: .github/scripts/ci/merge-digests.sh

      - name: Verify pushed images
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: .github/scripts/ci/verify-digests.sh

  # Apply the floating/version tags now that `verify` has confirmed the pushed
  # digests are good. Skipped on PRs: PR builds are pushed by digest only for
  # inspection and must never move a tag that scheduled/manual runs own.
  publish:
    needs: [discover, verify]
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Merge digests
        run: .github/scripts/ci/merge-digests.sh

      - name: Apply tags
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: .github/scripts/ci/apply-tags.sh

  # Single aggregate gate for the branch-protection required status check. Matrix
  # jobs can't be required directly: their targets are discovered dynamically, and
  # a matrix job skipped via a failed `needs` reports a bare context that a required
  # check treats as passing. This job has a stable name, runs even when upstream
  # stages fail (if: always()), and fails unless every stage succeeded — so
  # requiring just "gate" gates the whole pipeline without touching CI when images
  # are added or removed.
  gate:
    needs: [discover, build, verify, publish]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Verify all stages succeeded
        env:
          RESULT_DISCOVER: ${{ needs.discover.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_PUBLISH: ${{ needs.publish.result }}
        run: .github/scripts/ci/gate.sh

