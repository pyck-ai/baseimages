name: build-images
run-name: Build and push Docker images

# Publish on every push to main so merged changes go out immediately, instead of
# waiting for the next weekday cron slot (previously up to ~72h over a weekend).
#
# The weekday cron is kept alongside the push trigger, not made redundant by it: it
# re-pulls upstream base images with unchanged tags, which is how CVE fixes that carry
# no version-string bump get inherited. A push only rebuilds when something in this
# repo changed, so it can't cover that case.
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
  # Validate every PR before merge so Renovate (and humans) always have a status check
  # to gate automerge on. PR runs push by digest only and do not export build cache
  # (see the discover step and push:/cache-to handling below).
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs, but only for PRs. `github.ref` is `refs/heads/main` for
# both `push` and `schedule`, so those two share a concurrency group; cancelling a
# main run mid-flight is unsafe because `publish` moves tags only after `build`
# has pushed by digest and `verify` has confirmed them — an in-flight cancel
# could leave some tags moved and others not. Main runs therefore queue behind
# each other instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Delegates discover -> build (push-by-digest) -> verify (imgverify against
  # .imgverify.yaml) -> publish (apply tags) -> gate to the shared workflow.
  # See pyck-ai/github-actions/.github/workflows/build-image.yml for the job
  # shape; this repo no longer carries its own copy.
  build:
    permissions:
      contents: read
      packages: write
    uses: pyck-ai/github-actions/.github/workflows/build-image.yml@0f2a51087bbeabb41edbf92ed2b248532e7a4602
    with:
      # Must match .imgverify.yaml's expected registry: the shared verify step
      # exports REGISTRY into imgverify's environment, and imgverify resolves
      # process.env.REGISTRY with higher precedence than the `registry:` field
      # inside .imgverify.yaml. Omitting this lets the shared workflow's
      # default (ghcr.io/pyck-ai) silently override the correct value.
      registry: ghcr.io/pyck-ai/baseimages
      # Distinct per-repo builder name so concurrent builds on the same
      # self-hosted runner don't collide on a shared default builder.
      builder-name: baseimages
    # Needed for the GHCR token and for the optional DOCKERHUB_USERNAME /
    # DOCKERHUB_TOKEN: this repo's Dockerfiles pull FROM alpine:, debian:,
    # golang: and nginxinc/nginx-unprivileged from Docker Hub, and anonymous
    # pulls across ~40-60 images would otherwise risk the 100-per-6h-per-IP
    # rate limit.
    secrets: inherit
