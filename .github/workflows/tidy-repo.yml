name: tidy-repo
run-name: Tidy repository

# Safe repo-level housekeeping (stale issues/PRs, old branches, workflow
# run cleanup). GHCR image retention is a separate concern, handled by
# tidy-ghcr.yml.

# Run daily at 12:00 UTC. Jobs are chained sequentially to avoid hitting GitHub API rate limits.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

# Never cancel a running maintenance job — partial cleanup is worse than no cleanup.
# The shared workflow deliberately declares no concurrency of its own (a
# duplicate group between caller and callee would deadlock the run), so this
# caller owns it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tidy-repo:
    uses: pyck-ai/github-actions/.github/workflows/tidy-repo.yml@12f4c2db2695ccf210fc8e1d915d4017c3a91631
    permissions:
      actions: write # required to delete workflow runs
      pull-requests: write # required to label/close issues and PRs
      issues: write # required to label/close issues; pull-requests does not grant this, it is a separate scope
      contents: write # required to delete branches
    secrets: inherit
