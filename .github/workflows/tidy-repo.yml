name: tidy-repo
run-name: Tidy repository

# Safe repo-level housekeeping (stale issues/PRs, old branches, workflow
# run cleanup). GHCR image retention is a separate concern, handled by
# tidy-ghcr.yml.

# Run daily at 15:00 UTC. Jobs are chained sequentially to avoid hitting GitHub API rate limits.
#
# Deliberately spaced from this repo's other two schedules (tidy-ghcr at
# 03:00, build-image at 09:00 on weekdays) and from flutter-rfw's
# tidy-repo at 12:00: all four repos share the same self-hosted runners,
# so overlapping crons would queue jobs against each other for no reason.
# Do not "tidy" this back in line with the other repos' slots.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

# Never cancel a running maintenance job — partial cleanup is worse than no cleanup.
# The shared workflow deliberately declares no concurrency of its own (a
# duplicate group between caller and callee would deadlock the run), so this
# caller owns it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tidy-repo:
    uses: pyck-ai/github-actions/.github/workflows/tidy-repo.yml@e11b1f384df6cf1a71b5ace1f741f7717880b866 # v0.1.0
    permissions:
      actions: write # required to delete workflow runs
      pull-requests: write # required to label/close issues and PRs
      issues: write # required to label/close issues; pull-requests does not grant this, it is a separate scope
      contents: write # required to delete branches
    secrets: inherit
