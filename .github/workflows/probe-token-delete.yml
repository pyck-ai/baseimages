name: probe-token-delete
run-name: Probe whether GITHUB_TOKEN can delete a GHCR package

# THROWAWAY DIAGNOSTIC. Delete this file once it has answered its question.
#
# Question: can the default GITHUB_TOKEN delete a GHCR package version, or is
# a classic PAT (GHCR_ADMIN_TOKEN) genuinely required? GitHub documents that a
# repository which PUBLISHES a package via a workflow is automatically granted
# admin on that package, and that deleting via the REST API with GITHUB_TOKEN
# is supported for packages the token has admin on. If that holds here, the
# org can drop its long-lived PAT entirely.
#
# It publishes a package that exists only for this probe, so nothing real is
# at risk. The final step deletes the probe package with the admin PAT
# regardless of the outcome, so a failed probe cannot leave litter behind.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe GITHUB_TOKEN package deletion
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write # publish the throwaway package as this repo
    env:
      PKG: tidy-token-probe
      REF: ghcr.io/pyck-ai/tidy-token-probe:probe
    steps:
      - name: Build and push a throwaway image as this repository
        run: |
          set -eu
          workdir=$(mktemp -d)
          echo "probe" > "$workdir/probe.txt"
          printf 'FROM scratch\nCOPY probe.txt /\n' > "$workdir/Dockerfile"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$REF" "$workdir"
          docker push "$REF"

      - name: Try to delete it with GITHUB_TOKEN
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          api=https://api.github.com/orgs/pyck-ai/packages/container/$PKG

          # A package's last remaining version cannot be deleted individually
          # (HTTP 400), so probe the version endpoint AND the package endpoint.
          vid=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  "$api/versions" | jq -r '.[0].id // empty')
          echo "version id: ${vid:-<none>}"

          ver_code=$(curl -sS -o /tmp/ver.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$api/versions/$vid" || true)
          echo "DELETE version  -> HTTP $ver_code"
          cat /tmp/ver.json || true

          pkg_code=$(curl -sS -o /tmp/pkg.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$api" || true)
          echo "DELETE package  -> HTTP $pkg_code"
          cat /tmp/pkg.json || true

          {
            echo "## GITHUB_TOKEN delete probe"
            echo ""
            echo "| call | status |"
            echo "|---|---|"
            echo "| DELETE version | $ver_code |"
            echo "| DELETE package | $pkg_code |"
            echo ""
            echo "204 = GITHUB_TOKEN suffices, the PAT can be retired."
            echo "403/404 = a PAT or GitHub App is genuinely required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up with the admin PAT regardless of the result
        if: always()
        env:
          ADMIN: ${{ secrets.GHCR_ADMIN_TOKEN }}
        run: |
          set -eu
          [ -n "${ADMIN:-}" ] || { echo "no admin PAT available; probe package may persist"; exit 0; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $ADMIN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/orgs/pyck-ai/packages/container/$PKG" || true)
          echo "cleanup DELETE package -> HTTP $code (404 means the probe already removed it)"
