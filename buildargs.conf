# Build arguments for Docker Bake.
#
# Task sources this file via dotenv and forwards every variable to Bake as
# --set *.args.<KEY>=<VALUE>, making each entry available as a Docker ARG in
# all Dockerfiles.
#
# Versions are managed by Renovate. The comment above each version entry is a
# Renovate manager annotation: datasource selects the version feed, depName
# identifies the package, and extractVersion / versioning handle non-standard
# version string formats.
#
# To add a new tool: add a KEY=value line with a Renovate annotation comment,
# then declare the matching ARG in the Dockerfile and variable in docker-bake.hcl.

ALPINE_MIRRORS=https://mirror.netcologne.de/alpine,https://mirror.leaseweb.com/alpine
ALPINE_REPOS=main,community

# renovate: datasource=docker depName=alpine extractVersion=^alpine(?<version>[0-9][0-9.]+)$ versioning=loose
ALPINE_VERSION=3.23

# renovate: datasource=docker depName=debian versioning=regex:^(?<major>[a-z]+)$
DEBIAN_RELEASE=trixie

# renovate: datasource=github-releases depName=oven-sh/bun
BUN_VERSION=1.3.13

# renovate: datasource=custom.anthropic-claude depName=claude
CLAUDE_VERSION=2.1.215

# renovate: datasource=github-releases depName=go-delve/delve
DELVE_VERSION=1.26.3

# renovate: datasource=github-releases depName=flutter/flutter
FLUTTER_VERSION=3.38.1

# renovate: datasource=github-releases depName=superfly/flyctl
FLYCTL_VERSION=0.4.71

# renovate: datasource=github-releases depName=cli/cli
GHCLI_VERSION=2.96.0

# renovate: datasource=golang-version depName=golang
GOLANG_VERSION=1.26.4

# renovate: datasource=github-releases depName=fe3dback/go-arch-lint
GOARCHLINT_VERSION=1.16.0

# renovate: datasource=github-releases depName=golangci/golangci-lint
GOLANGCILINT_VERSION=2.12.2

# renovate: datasource=github-releases depName=gotestyourself/gotestsum
GOTESTSUM_VERSION=1.13.0

# renovate: datasource=github-releases depName=helm/helm
HELM_VERSION=4.2.3

# renovate: datasource=github-releases depName=kubernetes/kubernetes
KUBECTL_VERSION=1.36.2

# renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
KUSTOMIZE_VERSION=5.8.1

# renovate: datasource=docker depName=nginxinc/nginx-unprivileged
NGINX_VERSION=1.29

# renovate: datasource=github-releases depName=anomalyco/opencode
OPENCODE_VERSION=1.18.2

# renovate: datasource=docker depName=python versioning=regex:^(?<major>\d+)\.(?<minor>\d+)$
PYTHON_VERSION=3.14

# renovate: datasource=github-releases depName=astral-sh/ruff
RUFF_VERSION=0.15.22

# renovate: datasource=github-releases depName=astral-sh/uv
UV_VERSION=0.11.29

# renovate: datasource=github-releases depName=apollographql/rover
ROVER_VERSION=0.41.0

# renovate: datasource=github-releases depName=go-task/task
TASKFILE_VERSION=3.52.0

# renovate: datasource=github-releases depName=watchexec/watchexec
WATCHEXEC_VERSION=2.5.1

