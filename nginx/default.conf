# This is a default configuration for a Single Page Application (SPA) served by
# NGINX. It is intended to be used with applications like pyck-admin and
# pyck-frontend.
#
# You can override this file by mounting your own configuration file to
# /etc/nginx/conf.d/default.conf in the container.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /app/;
    index  index.html;

    # Apply security headers
    add_header  X-Frame-Options SAMEORIGIN always;
    add_header  X-Content-Type-Options nosniff always;
    add_header  Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to hidden files and directories
    location ~ /\. {
        deny  all;
    }

    # Use default error pages
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root  /usr/share/nginx/html;
    }

    # Handle health checks (k8s, docker-compose, etc...)
    location = /health {
        access_log  off;

        add_header  'Content-Type' 'application/json';

        return  200 '{"status":"UP"}';
    }


    # Disable cache for settings.json (SPA runtime config)
    location = /static/settings.json {
        try_files  $uri =404;

        expires     -1;
        add_header  Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets for 30 days by default
    location /static/ {
        try_files  $uri =404;

        location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|map)$ {
            expires     30d;
            add_header  Cache-Control "public, max-age=2592000, immutable";
        }
    }


    # Do not cache index.html (SPA entrypoint)
    location = /index.html {
        expires     -1;
        add_header  Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Route all non-existing files to index.html (SPA routing)
    location / {
        try_files  $uri $uri/ /index.html;
    }
}
